<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- PyScript -->
    <link rel="stylesheet" href="https://pyscript.net/releases/2026.7.3/core.css" />
    <script type="module" src="https://pyscript.net/releases/2026.7.3/core.js"></script>

    <title>Skills Test</title>

    <style>
        body {
            background-color: #001f3f; /* navy blue */
            font-family: 'Gill Sans', Calibri, sans-serif;
            margin: 0;
            padding: 0;
        }

        h1 {
            color: #f5f5dc; /* cream */
            font-size: 3.5em;
            margin-top: 5%;
            text-align: center;
            font-family: Impact, Haettenschweiler, 'Arial Narrow Bold', sans-serif;
        }

        h2 {
            color: #add8e6; /* light blue */
            font-size: 2em;
            text-align: center;
            margin-bottom: 20px;
        }

        #form {
            width: 55%;
            margin: 0 auto;
            padding: 25px;
            color: #f5f5dc; /* cream text */
            background-color: rgba(173, 216, 230, 0.15); /* soft light blue overlay */
            border-radius: 20px;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.2);
        }

        label {
            font-size: 1.2em;
        }

        button {
            background-color: #add8e6; /* light blue */
            color: #001f3f; /* navy text */
            border: none;
            padding: 10px 20px;
            margin-top: 15px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        button:hover {
            background-color: #f5f5dc; /* cream hover */
            color: #001f3f;
        }

        #receipt {
            margin-top: 20px;
            padding: 15px;
            background-color: rgba(245, 245, 220, 0.2); /* cream overlay */
            border: 1px solid #add8e6;
            border-radius: 10px;
            text-align: center;
            color: #f5f5dc;
        }
    </style>
</head>
<body>

    <h1>Cookie Basket Receipt</h1>

    <div id="form">
        <h2>Choose Your Cookies 🍪</h2>

        <input type="checkbox" id="item1" value="140.00">
        <label for="item1">Sugar-Free Chocolate Chip Cookies</label>
        <br><br>

        <input type="checkbox" id="item2" value="160.00">
        <label for="item2">Matcha Cookies</label>
        <br><br>

        <input type="checkbox" id="item3" value="180.00">
        <label for="item3">Red Velvet Cookies</label>
        <br><br>

        <input type="checkbox" id="item4" value="200.00">
        <label for="item4">Brownie Cookies</label>
        <br><br>

        <button type="button" py-click="create_order">Generate Receipt</button>
        <button type="button" onclick="location.reload()">Reset</button>

        <div id="receipt"></div>
    </div>

    <!-- Python logic -->
    <script type="py" src="main.py"></script>

</body>
</html>
