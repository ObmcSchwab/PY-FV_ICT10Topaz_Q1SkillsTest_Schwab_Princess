<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <title>Login</title>
  <style>
    body {
      background: #f0f4f8;
    }
    #form-div {
      background-color: rgba(25, 25, 112, 0.9); /* navy blue */
      width: 400px;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
      color: #fff;
    }
    h1 {
      color: navy;
    }
    button.btn-info {
      background-color: navy;
      border: none;
      color: #fff;
    }
    button.btn-info:hover {
      background-color: #001f4d;
      color: #fff;
    }
  </style>
</head>
<body class="d-flex justify-content-center align-items-center vh-100">

  <div class="container text-center" id="form-div">
    <h1>Sign In</h1>
    <p>Glad to see you again!</p>

    <details class="ontoggle">
      <summary><i>Need help?</i></summary>
      <p id="instructions">Type your username and password to continue.</p>
    </details>

    <form>
      <div class="mb-3">
        <label for="user" class="form-label"><b>Username:</b></label>
        <input type="text" name="user" id="user" placeholder="Enter your username..." class="form-control">
      </div>

      <div class="mb-3">
        <label for="pw" class="form-label"><b>Password:</b></label>
        <input type="password" name="pw" id="pw" placeholder="Enter your password..." class="form-control">
      </div>

      <div class="mb-3">
        <label for="checkbox">Remember me</label>
        <input type="checkbox" name="checkbox-rmbr" id="rmbr" onclick="checkbox()">
      </div>

      <i><div id="display"></div></i>

      <!-- Feedback messages -->
      <div id="feedback"></div>

      <button type="button" class="btn btn-info w-100 mt-3" onclick="GETIN()">Sign In</button>
    </form>
  </div>

  <script>
    function GETIN(){
      let user = document.getElementById("user").value;
      let password = document.getElementById("pw").value;
      let feedback = document.getElementById("feedback");

      if (user=="mikmikk" && password=="yawnn"){
        feedback.innerHTML = '<div class="alert alert-success mt-3">Login successful! Redirecting...</div>';
        setTimeout(() => {
          window.location.href = "notebooks.html";
        }, 1500);
      } else {
        feedback.innerHTML = '<div class="alert alert-danger mt-3">Oops! Invalid username or password.</div>';
      }
    }

    function checkbox() {
      let remember = document.getElementById("rmbr").checked; 
      let display = document.getElementById("display");

      if (remember) {
        display.innerHTML = "We’ll remember your login next time!";
      } else {
        display.innerHTML = "We won’t save your login.";
      }
    }
  </script>
</body>
</html>
